[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # These two values are PUBLIC by design (they are shipped to the browser; data is protected by Supabase row-level security).
  # Tell Netlify's secrets scanner not to fail the build because they appear in the bundle.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Single-page app: every unknown path serves index.html (real files such as /audio/*.mp3 win first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/audio/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/audio/ar/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/en/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/id/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/fr/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/es/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
