<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1A62" />
    <meta name="description" content="MohLeyla — learn Modern Standard Arabic, Saudi Arabic, English and Indonesian with guided lessons, audio and practice. تعلّم · Belajar · Learn." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="MohLeyla" />
    <meta property="og:description" content="Learn Arabic, Saudi Arabic, English and Indonesian." />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MohLeyla" />
    <title>MohLeyla</title>
    <style>
      /* Boot screen: visible before React mounts. Never depends on the JS bundle. */
      html,body{margin:0;background:#F4F8FF;color:#0B2A6F}
      @media (prefers-color-scheme:dark){html:not([data-theme=light]),html:not([data-theme=light]) body{background:#0A1426;color:#E8F0FF}}
      #boot{position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif}
      #boot div{text-align:center}
      #boot img{width:88px;height:88px;animation:bootpulse 1.6s ease-in-out infinite}
      #boot b{display:block;margin-top:12px;font-size:22px;letter-spacing:.2px}
      @keyframes bootpulse{50%{transform:scale(1.06)}}
      @media (prefers-reduced-motion:reduce){#boot img{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-live="polite"><div><img src="/icons/logo-mark-128.webp" width="88" height="88" alt="" /><b>MohLeyla</b></div></div></div>
    <noscript>MohLeyla needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
